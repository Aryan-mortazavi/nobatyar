# CI for NobatYar
#
# This file MUST live at <repo-root>/.github/workflows/. GitHub only reads
# workflows from the root .github directory; the previous copy at
# nobatyar/.github/workflows/ci.yml was silently ignored, so no commit had ever
# been verified.
#
# The application lives in nobatyar/, so every `run:` step is scoped there.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: nobatyar

jobs:
  quality:
    name: typecheck · unit tests · build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
      AUTH_SECRET: ci-secret-key-must-be-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_DEFAULT_LOCALE: fa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nobatyar/package-lock.json

      - run: npm ci

      - name: Prisma client
        run: npx prisma generate

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    name: end-to-end (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nobatyar/package-lock.json

      - run: npm ci

      - name: Prisma client
        run: npx prisma generate

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # the suite creates and seeds its own SQLite file (prisma/e2e.db) and
      # serves the production build on port 3210
      - name: Playwright
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            nobatyar/playwright-report/
            nobatyar/test-results/
          retention-days: 7

  docker:
    name: docker image
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # the Dockerfile lives in nobatyar/, so the build context is that folder
      - uses: docker/build-push-action@v6
        with:
          context: ./nobatyar
          file: ./nobatyar/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max