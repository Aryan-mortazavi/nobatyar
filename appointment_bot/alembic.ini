# ---------------------------------------------------------------------------
# Alembic - database migrations
#
#   cd appointment_bot
#   ..\venv\Scripts\alembic upgrade head       # apply every migration
#   ..\venv\Scripts\alembic revision --autogenerate -m "description"
#
# The connection string is NOT stored here - alembic/env.py reads it from the
# .env file (DATABASE_URL), so no secret is ever written into this file.
# ---------------------------------------------------------------------------
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
