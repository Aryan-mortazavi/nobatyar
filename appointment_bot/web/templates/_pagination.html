{% if pager and pager.total_pages > 1 %}
<nav class="pagination">
  {% if pager.has_prev %}
    <a class="btn btn-ghost" href="{{ pager.prev_url }}">« قبلی</a>
  {% endif %}
  {% for p in pager.window %}
    <a class="btn {{ 'btn-primary' if p == pager.page else 'btn-ghost' }}"
       href="{{ pager.page_url(request, p) }}">{{ p }}</a>
  {% endfor %}
  {% if pager.has_next %}
    <a class="btn btn-ghost" href="{{ pager.next_url }}">بعدی »</a>
  {% endif %}
  <span class="muted small">{{ pager.total }} رکورد</span>
</nav>
{% endif %}
