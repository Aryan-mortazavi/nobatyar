<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NobatYar">
  <title>NobatYar</title>
  <!--
    Brand mark for NobatYar.
    Concept: a calendar leaf whose bottom-right corner is folded back in the
    brand gold, with a check inside — "your appointment is confirmed".
    Grid: 64 × 64, corner radius 12, minimum stroke 4.
  -->
  <defs>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F0A800" />
      <stop offset="1" stop-color="#FFC93C" />
    </linearGradient>
  </defs>

  <!-- motion lines -->
  <g stroke="url(#gold)" stroke-width="4" stroke-linecap="round">
    <path d="M2.5 27.5h7" />
    <path d="M2.5 36.5h4.5" />
  </g>

  <!-- folded corner (behind the body) -->
  <path d="M58 39.5A18.5 18.5 0 0 1 39.5 58H58Z" fill="url(#gold)" />

  <!-- calendar body: rounded everywhere except the folded corner -->
  <path
    d="M24 12h22a12 12 0 0 1 12 12v15.5L43.5 58H24a12 12 0 0 1-12-12V24a12 12 0 0 1 12-12Z"
    fill="#0B1B34" />

  <!-- binding rings -->
  <g fill="#0B1B34">
    <rect x="20" y="4.5" width="7" height="13.5" rx="3.5" />
    <rect x="39" y="4.5" width="7" height="13.5" rx="3.5" />
  </g>

  <!-- thin light gap along the fold keeps the two tones readable -->
  <path d="M58 40.5 43.5 58" stroke="#0B1B34" stroke-width="0" />
  <path d="M57 41.5 44.5 57.5" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1" />

  <!-- check -->
  <path
    d="m23 36.5 6.5 6.5 12.5-13.5"
    fill="none"
    stroke="#ffffff"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round" />
</svg>
